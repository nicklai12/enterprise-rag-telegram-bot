# spec.md §8：企業 RAG 知識庫每日排程流水線
#
# 依序執行，任一步失敗即中止（verify 失敗 → publisher 被跳過，不發布）：
#   classifier → watcher → parser → chunker → embedder → indexer
#   → verify → publisher → commit status/kb_status.json
name: kb-pipeline

on:
  schedule:
    # 每日一次（台北時間 02:30 = UTC 18:30，避開整點尖峰）
    - cron: "30 18 * * *"
  # 手動觸發（驗收 / 除錯用）
  workflow_dispatch:

# 避免重疊執行：同 group 的 run 尚未結束時，新的 run 會「等待」前一個結束
concurrency:
  group: kb-pipeline
  cancel-in-progress: false

# Chroma Cloud 憑證一律由 GitHub Secrets 注入（pipeline.yaml 不含密鑰）
env:
  CHROMA_API_KEY: ${{ secrets.CHROMA_API_KEY }}
  CHROMA_TENANT: ${{ secrets.CHROMA_TENANT }}
  CHROMA_DATABASE: ${{ secrets.CHROMA_DATABASE }}

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # unstructured（PDF hi_res 需 poppler）與 torch/PIL（需 libGL）的系統相依
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils libgl1

      - name: Install dependencies
        # 完整 pipeline 依賴（torch/unstructured 等）；requirements.txt 為 bot 精簡版（issue #41）
        run: pip install -r requirements-pipeline.txt

      # 每次 pipeline 執行「共用一個」kb_run_id（spec §4.1），
      # 由 workflow 產生並傳給 indexer / verify / publisher
      - name: Generate kb_run_id
        id: run_id
        run: echo "kb_run_id=$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: classifier
        run: python doc_classifier.py

      - name: watcher
        id: watcher
        run: echo "batch=$(python doc_watcher.py | jq -c .)" >> "$GITHUB_OUTPUT"

      # batch 為空（沒有新增/變更文件）時，略過 parser 之後的所有階段
      - name: parser
        if: ${{ steps.watcher.outputs.batch != '[]' }}
        run: |
          echo '${{ steps.watcher.outputs.batch }}' | jq -r '.[]' | while IFS= read -r f; do
            python parser.py "$f"
          done

      # 依 parser 寫出的 manifest 彙整「解析成功／失敗」清單。
      # 不透過解析 parser stdout 判斷狀態：unstructured 會把警告印在 stdout 上，
      # 與 manifest JSON 混在一起。下游只處理解析成功的文件（issue #20）。
      # 無 if：batch 為空時自然輸出 ok='[]'，下游步驟据此全部略過。
      - name: parser results
        id: parser_results
        run: |
          ok='[]'
          failed='[]'
          while IFS= read -r f; do
            doc_id=$(python doc_classifier.py --doc-id "$f")
            manifest="data/parsed/${doc_id}.manifest.json"
            if [ -f "$manifest" ] && [ "$(jq -r .status "$manifest")" = "success" ]; then
              ok=$(jq -c --arg f "$f" '. + [$f]' <<<"$ok")
            else
              failed=$(jq -c --arg f "$f" '. + [$f]' <<<"$failed")
              echo "::warning::parser failed: $f (manifest: $manifest)"
            fi
          done < <(echo '${{ steps.watcher.outputs.batch }}' | jq -r '.[]')
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      # 只迭代 parser 成功的文件：解析失敗的文件（如掃描件缺 OCR，issue #19）
      # 沒有 parsed json，直接跑會 FileNotFoundError 拖垮整批（issue #20）
      - name: chunker
        if: ${{ steps.parser_results.outputs.ok != '[]' }}
        run: |
          echo '${{ steps.parser_results.outputs.ok }}' | jq -r '.[]' | while IFS= read -r f; do
            # doc_id 一律由 doc_classifier 推導，避免 shell 規則與 Python 漂移（issue #15）
            doc_id=$(python doc_classifier.py --doc-id "$f")
            python chunker.py --parsed "data/parsed/${doc_id}.json"
          done

      - name: embedder
        if: ${{ steps.parser_results.outputs.ok != '[]' }}
        run: |
          echo '${{ steps.parser_results.outputs.ok }}' | jq -r '.[]' | while IFS= read -r f; do
            doc_id=$(python doc_classifier.py --doc-id "$f")
            python embedder.py --chunks "data/chunks/${doc_id}.json"
          done

      - name: indexer
        if: ${{ steps.parser_results.outputs.ok != '[]' }}
        run: |
          echo '${{ steps.parser_results.outputs.ok }}' | jq -r '.[]' | while IFS= read -r f; do
            doc_id=$(python doc_classifier.py --doc-id "$f")
            python indexer.py \
              --chunks "data/chunks/${doc_id}.json" \
              --embeddings "data/embeddings/${doc_id}.npy" \
              --kb-run-id "${{ steps.run_id.outputs.kb_run_id }}"
          done

      # 只讀審計候選 kb_run_id；任何一項檢查不過 → exit code 非 0 → publisher 被跳過。
      # doc_id 一律由 doc_classifier 推導（issue #15）；只加總本批次成功文件的
      # manifests 作為期望 chunk 數，避免目錄內 fixture/殘留 manifest 污染（issue #33）
      - name: verify
        if: ${{ steps.parser_results.outputs.ok != '[]' }}
        run: |
          args=(--kb-run-id "${{ steps.run_id.outputs.kb_run_id }}")
          while IFS= read -r f; do
            doc_id=$(python doc_classifier.py --doc-id "$f")
            args+=(--doc-id "$doc_id")
          done < <(echo '${{ steps.parser_results.outputs.ok }}' | jq -r '.[]')
          python verify_index.py "${args[@]}"

      # 只有 verify 成功（success()）才會執行：更新 control collection 的 active 指標
      - name: publisher
        if: ${{ success() && steps.parser_results.outputs.ok != '[]' }}
        run: python publisher.py --kb-run-id "${{ steps.run_id.outputs.kb_run_id }}"

      # 批次內有任何文件解析失敗時讓整輪標記為失敗：
      # 成功的文件已完成入庫/發布，但 watcher_state 不提交（僅 success()），
      # 失敗的文件下一輪重新排入重試，不會被靜默標記為已處理（issue #17/#20）
      - name: parse failure gate
        if: ${{ steps.watcher.outputs.batch != '[]' && steps.parser_results.outputs.failed != '[]' }}
        run: |
          echo '${{ steps.parser_results.outputs.failed }}' | jq -r '.[]' | while IFS= read -r f; do
            echo "::error::parser failed (will retry next run): $f"
          done
          exit 1

      # 看板/報告 commit 回 repo（verify 失敗也會把 failed 紀錄寫進 kb_status.json）
      - name: commit kb_status.json
        if: ${{ always() && steps.watcher.outputs.batch != '[]' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/kb_status.json
          if git diff --cached --quiet; then
            echo "no status changes to commit"
          else
            git commit -m "chore: update kb status [skip ci]"
            git push
          fi

      # watcher_state 只反映「完整跑完」的批次。中途失敗時這批文件實際未進索引，
      # 若照樣提交 state，之後每輪 watcher 都會因 hash 相符而靜默跳過它們（issue #17）
      - name: commit watcher_state.json
        if: ${{ success() && steps.watcher.outputs.batch != '[]' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/watcher_state.json
          if git diff --cached --quiet; then
            echo "no watcher state changes to commit"
          else
            git commit -m "chore: update watcher state [skip ci]"
            git push
          fi
