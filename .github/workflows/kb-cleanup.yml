# 手動清理 Chroma Cloud data collection 中的舊 kb_run_id 版本（issue #25）。
#
# 做法 B 每次 pipeline 都保留候選版本，Starter 額度（300 筆 records）用盡時
# 以此工具騰出空間。額度以「整個 database」計算，若殘留資料在其他 collection，
# 用 inspect 模式找出位置。本 workflow 僅由 workflow_dispatch 手動觸發。
name: kb-cleanup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect=盤點全庫 / dry-run=只預覽 / keep-active=只刪非 active 版本 / all=全刪重來"
        required: true
        default: "dry-run"
        type: choice
        options:
          - inspect
          - dry-run
          - keep-active
          - all

# 與 kb-pipeline 共用 lock：清理與流水線不能同時對 collection 操作
concurrency:
  group: kb-pipeline
  cancel-in-progress: false

# Chroma Cloud 憑證一律由 GitHub Secrets 注入
env:
  CHROMA_API_KEY: ${{ secrets.CHROMA_API_KEY }}
  CHROMA_TENANT: ${{ secrets.CHROMA_TENANT }}
  CHROMA_DATABASE: ${{ secrets.CHROMA_DATABASE }}

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 只需要 chromadb + PyYAML（cleanup_old_kb_runs.py 的相依），
      # 不裝完整 requirements.txt（torch / unstructured 太重）
      - name: Install dependencies
        run: pip install "chromadb>=1.0,<2.0" "PyYAML>=6.0,<7.0"

      - name: Inspect database
        if: ${{ inputs.mode == 'inspect' }}
        # 唯讀盤點：列出 tenant 內「所有 database」的 collection 筆數與 kb_run_id 分佈。
        # Chroma Cloud Starter 的 NumRecords 額度可能跨 database 計算——
        # 若殘留資料落在 pipeline 使用的 database 之外，只在單庫內找會找不到（issue #25）。
        run: |
          python - <<'EOF'
          import json
          import os
          from collections import Counter

          import chromadb
          from chromadb import AdminClient, Settings

          api_key = os.environ["CHROMA_API_KEY"]
          tenant = os.environ["CHROMA_TENANT"]

          cloud_settings = Settings(
              chroma_api_impl="chromadb.api.fastapi.FastAPI",
              chroma_server_host="api.trychroma.com",
              chroma_server_http_port=443,
              chroma_server_ssl_enabled=True,
              chroma_client_auth_provider="chromadb.auth.token_authn.TokenAuthClientProvider",
              chroma_client_auth_credentials=api_key,
              chroma_auth_token_transport_header="X-Chroma-Token",
              chroma_overwrite_singleton_tenant_database_access_from_auth=True,
          )
          admin = AdminClient(settings=cloud_settings)
          databases = admin.list_databases(tenant=tenant)

          report = []
          for db in databases:
              # list_databases() 回傳 dict（部分版本為 Database 物件），兩者都支援
              db_name = db["name"] if isinstance(db, dict) else db.name
              client = chromadb.CloudClient(tenant=tenant, database=db_name, api_key=api_key)
              collections = []
              for name in sorted(c.name for c in client.list_collections()):
                  col = client.get_collection(name)
                  entry = {"collection": name, "records": col.count()}
                  if entry["records"]:
                      found = col.get(include=["metadatas"])
                      runs = Counter(
                          (m or {}).get("kb_run_id") or "(no kb_run_id)"
                          for m in found["metadatas"]
                      )
                      entry["kb_run_ids"] = dict(sorted(runs.items()))
                  collections.append(entry)
              report.append({"database": db_name, "collections": collections})
          print(json.dumps({"tenant": tenant, "databases": report}, ensure_ascii=False, indent=2))
          EOF

      - name: Run cleanup
        if: ${{ inputs.mode != 'inspect' }}
        run: |
          set -e
          case "${{ inputs.mode }}" in
            dry-run)     python cleanup_old_kb_runs.py --dry-run ;;
            keep-active) python cleanup_old_kb_runs.py ;;
            all)         python cleanup_old_kb_runs.py --all ;;
          esac
